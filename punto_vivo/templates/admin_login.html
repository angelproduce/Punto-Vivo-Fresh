{% extends "base.html" %}
{% block title %}Acceso administrativo · PUNTO VIVO FRESH{% endblock %}
{% block body %}
<div class="login-page">
  <div class="login-decor" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark brand-logo"><img src="/static/logo.png" alt="Logo de Punto Vivo Fresh" width="42" height="42"></span>
      <span><strong>PUNTO VIVO</strong><em>FRESH</em></span>
    </div>
    <div class="login-heading">
      <span class="eyebrow">PANEL PRIVADO</span>
      <h1>Iniciar sesión</h1>
      <p>Accede al panel administrativo del negocio.</p>
    </div>
    <form id="login-form" novalidate>
      <label for="email">Correo electrónico</label>
      <div class="input-wrap"><span class="input-icon">✉️</span><input id="email" type="email" autocomplete="username" required placeholder="admin@ejemplo.com"></div>
      <label for="password">Contraseña</label>
      <div class="input-wrap"><span class="input-icon">🔒</span><input id="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"></div>
      <div class="msg" id="login-msg" role="alert" hidden></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">ENTRAR AL PANEL</button>
    </form>
    <a class="back-link" href="/bienvenida">← Volver al registro de visitas</a>
  </div>
</div>
<script>
  const aviso = sessionStorage.getItem('pv_login_msg');
  if (aviso) {
    const inicial = document.getElementById('login-msg');
    inicial.textContent = aviso;
    inicial.className = 'msg ok';
    inicial.hidden = false;
    sessionStorage.removeItem('pv_login_msg');
  }
  document.getElementById('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const btn = document.getElementById('login-btn');
    const msg = document.getElementById('login-msg');
    msg.hidden = true;
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = 'Verificando…';
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: document.getElementById('email').value,
                              password: document.getElementById('password').value})
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'No se pudo iniciar sesión.');
      sessionStorage.setItem('pv_csrf', data.csrf_token);
      location.href = '/admin';
    } catch (err) {
      msg.textContent = err.message;
      msg.hidden = false;
      btn.disabled = false;
      btn.textContent = 'ENTRAR AL PANEL';
    }
  });
</script>
{% endblock %}
