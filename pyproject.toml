[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-ai"
version = "1.0.0"
description = "ANGEL PRODUCE IA · generador local de shorts con voz clonada"
requires-python = ">=3.10"
# Vercel instala desde pyproject.toml (tiene prioridad sobre requirements.txt).
# Solo dependencias de PUNTO VIVO FRESH; el generador local sigue usando
# requirements.txt (Torch, Whisper, FFmpeg, modelos, etc.) sin cambios.
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "qrcode[pil]>=8.2,<9",
    "pillow>=10,<12",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    # Web Push: Vercel instala desde aquí; requirements.txt no se instala allí.
    "pywebpush>=2,<3",
]

[tool.vercel]
entrypoint = "punto_vivo.app:app"

[tool.setuptools.packages.find]
where = ["src"]
